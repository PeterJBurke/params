<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EECS 195 Parameter Checker</title>
    <style>
        body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; margin: 24px; }
.container { max-width: 800px; margin: 0 auto; }
table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
th { background: #f5f5f5; }
.value-cell { min-height: 2em; font-family: monospace; }
.check-cell { text-align: center; font-size: 1.2em; font-weight: bold; }
.pass { color: #28a745; }
.fail { color: #dc3545; }
.not-found { color: #666; font-style: italic; }
#drop-zone { margin-top: 8px; padding: 20px; border: 2px dashed #bbb; border-radius: 8px; text-align: center; color: #666; transition: border-color .15s, background-color .15s; }
#drop-zone.dragover { border-color: #0078d4; background: #f0f8ff; color: #003a6b; }
#file-input { display: none; }
.controls { display:flex; gap:8px; align-items:center; margin-top:8px; justify-content:center; }
button { padding: 8px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
button:active { transform: translateY(1px); }
.hint { color: #666; font-size: .9em; }
#verdict { font-size: 2em; font-weight: bold; margin-top: 16px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>EECS195 Parameter Checker</h1>

        <div id="drop-zone" tabindex="0" aria-label="File drop area">
            <p>Drag &amp; drop a file here or click "Choose file" to upload.</p>
            <div class="controls">
                <button type="button" id="choose-btn">Choose file</button>
                <input id="file-input" type="file" accept=".param" aria-label="Choose file" />
                <span class="hint" id="selected-file">No file chosen</span>
            </div>
        </div>

        <div id="verdict"></div>

        <table id="data-table" aria-label="Data table">
            <thead>
                <tr><th>Parameter</th><th>Units</th><th>Your Value</th><th>Correct Value</th><th>Check</th></tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="checker.js"></script>
    <script>
(function () {
    'use strict';
    var C = window.ParamChecker;
    // Same eight rows as the original checker, in the same order.
    var ROWS = ['arming', 'batt_low', 'ek3_glitch', 'rtl_alt', 'fs_thr', 'fence_enable', 'fence_alt_max', 'fence_action'];
    var UNITS = { 'skip-bitmask': 'Bitmask', 'perform-bitmask': 'Bitmask', V: 'Volts', m: 'Meters', cm: 'Centimeters', 'enum': '-' };
    var BOOLEAN = { FENCE_ENABLE: 1 };
    var reqs = {};
    C.REQUIREMENTS.forEach(function (r) { reqs[r.id] = r; });

    function correctFor(req, alias) {
        var rule = req.profiles.arc;
        if (req.kind === 'arming') return alias.name === 'ARMING_SKIPCHK' ? '0' : '1';
        if (req.kind === 'enum') return String(rule.expect);
        return String(+(rule.expect / (alias.factor || 1)).toFixed(6));
    }
    function unitsFor(alias) { return BOOLEAN[alias.name] ? 'Boolean' : (UNITS[alias.units] || alias.units); }
    function num(v) { return Number.isInteger(v) ? String(v) : String(+v.toFixed(6)); }

    function render(result) {
        var tbody = document.getElementById('tbody');
        tbody.innerHTML = '';
        var byId = {};
        if (result) result.rows.forEach(function (r) { byId[r.id] = r; });
        ROWS.forEach(function (id) {
            var req = reqs[id];
            var res = byId[id];
            var aliases = req.aliases;
            if (res && res.found.length) aliases = req.aliases.filter(function (a) { return res.found.indexOf(a.name) >= 0; });
            var tr = document.createElement('tr');
            var names = aliases.map(function (a) { return a.name; }).join(' / ');
            var units = aliases.map(unitsFor).join(' / ');
            var correct = aliases.map(function (a) { return correctFor(req, a); }).join(' / ');
            var yours = '', yoursClass = 'value-cell';
            if (res) {
                if (res.found.length) yours = aliases.map(function (a) { return num(result.params[a.name]); }).join(' / ');
                else { yours = 'Not Found'; yoursClass += ' not-found'; }
            }
            var pass = res && res.status === 'PASS';
            var cells = [[names, ''], [units, ''], [yours, yoursClass], [correct, ''], [pass ? '✔' : '❌', 'check-cell' + (res ? (pass ? ' pass' : ' fail') : '')]];
            cells.forEach(function (c) { var td = document.createElement('td'); td.textContent = c[0]; if (c[1]) td.className = c[1]; tr.appendChild(td); });
            if (res && res.status === 'CONFLICT') tr.title = 'Old and new parameter names disagree. Fix on the aircraft.';
            tbody.appendChild(tr);
        });
    }

    function processFile(file) {
        var label = document.getElementById('selected-file');
        if (!file || !/\.param$/i.test(file.name)) {
            alert('Invalid file type. Please upload a .param file.');
            label.textContent = 'No file chosen';
            return;
        }
        label.textContent = file.name;
        var reader = new FileReader();
        reader.onload = function (e) {
            var parsed = C.parse(e.target.result);
            var result = C.evaluate(parsed, 'arc');
            result.params = parsed.params;
            var bad = ROWS.some(function (id) { return result.rows.filter(function (r) { return r.id === id; })[0].status !== 'PASS'; });
            var v = document.getElementById('verdict');
            v.textContent = bad ? 'NO GO' : 'GO';
            v.className = bad ? 'fail' : 'pass';
            render(result);
        };
        reader.onerror = function () { alert('Error reading the file.'); };
        reader.readAsText(file);
    }

    var dropZone = document.getElementById('drop-zone');
    var fileInput = document.getElementById('file-input');
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(function (evt) {
        dropZone.addEventListener(evt, function (e) { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter', 'dragover'].forEach(function (evt) { dropZone.addEventListener(evt, function () { dropZone.classList.add('dragover'); }); });
    ['dragleave', 'drop'].forEach(function (evt) { dropZone.addEventListener(evt, function () { dropZone.classList.remove('dragover'); }); });
    dropZone.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]); });
    dropZone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
    document.getElementById('choose-btn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function () { if (fileInput.files.length) processFile(fileInput.files[0]); });

    render(null);
})();
    </script>
</body>
</html>
